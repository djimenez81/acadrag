# Shipped defaults for acadrag. Users override via $ACADRAG_HOME/config.yaml.

paths:
  # All paths are resolved relative to `home` unless absolute.
  # `home` itself is resolved from $ACADRAG_HOME or ~/.acadrag.
  home: null
  inbox: inbox
  processed: processed
  rejected: rejected
  logs: logs

database:
  # {home} is substituted at load time.
  url: "sqlite:///{home}/acadrag.sqlite"

stages:
  convert:
    backend: marker
    fallback: null
    device: cpu # cuda
    retries: 2
    sanity:
      min_word_ratio: 0.3
    marker:
      mode: fast
      # disable_ocr: true
      redo_inline_math:  true
      use_llm: false
      llm_service: marker.services.ollama.OllamaService
      ollama_base_url: http://localhost:11434
      ollama_model: llama3.2-vision
      max_concurrency: 3
    describe_images:
      enabled: false

models: {}
taxonomies: {}
classifiers: {}
